<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>  -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="

    <link rel="stylesheet" href="style.css" />
    <title>Weather Web App</title>
  </head>
  <body class="bg-blue-100 dark:bg-blue-950 transition-all duration-300">
    <!-- navbar -->
    <header class="px-16">
      <div
        class="bg-gray-400 rounded-xl px-4 w-full flex items-center justify-between text-white"
      >
        <!-- logo -->
        <div class="w-1/3 flex items-center">
          <img src="./assets/logo.png" alt="logo" class="h-16" />
          <h1 class="text-left">Daily Weather</h1>
        </div>

        <!-- searchbar -->
        <div class="w-1/3 flex justify-center">
          <input
            id="searchbar"
            type="text"
            placeholder="Search Your City"
            class="px-4 py-1 border-2 rounded-xl w-full max-w-xs placeholder:text-slate-700 text-black"
          />
          <button id="search-btn" class="ml-2">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </div>

        <!-- toggle dark mode -->
        <div class="w-1/3 flex justify-end">
          <label class="relative inline-block w-14 h-8 cursor-pointer">
            <input type="checkbox" id="toggle-dark" class="peer sr-only" />
            <span
              class="absolute inset-0 bg-gray-300 rounded-full transition-colors peer-checked:bg-gray-600"
            ></span>
            <span
              class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full shadow-md transition-transform peer-checked:translate-x-6"
              style="
                background-image: url('assets/lightMode.png');
                background-repeat: no-repeat;
                background-position: center;
                background-size: 20px;
              "
            ></span>
          </label>
        </div>
      </div>
    </header>

    <!-- main content -->
    <div class="flex justify-between mx-16">
      <!-- left content -->
      <div class="w-3/5">
        <!-- upper -->
        <div class="bg-gray-500 rounded-xl p-7 my-4">
          <div class="flex justify-between">
            <!-- location date temp -->
            <div class="flex flex-col gap-16 text-white">
              <div
                class="flex gap-2 items-center border-2 rounded-full py-2 px-4 w-fit"
              >
                <i class="fa-solid fa-location-dot"></i>
                <p id="current-location"></p>
              </div>

              <!-- date -->
              <div class="flex flex-col gap-2">
                <h1 id="current-day" class="text-4xl"></h1>
                <p id="current-date" class="text-sm"></p>
              </div>

              <!-- temp -->
              <div>
                <h1 id="current-temp" class="text-6xl">
                  <!-- 25°C -->
                </h1>
                <p id="current-temp-range" class="text-sm">
                  <!-- high: 30°C low: 20°C -->
                </p>
              </div>
            </div>

            <!-- toggle image weather -->
            <div class="flex flex-col text-white gap-3">
              <!-- toggle -->
              <div class="flex items-center gap-3 justify-end">
                <p>C</p>
                <label
                  class="relative inline-block w-16 h-8 cursor-pointer select-none"
                >
                  <input
                    type="checkbox"
                    id="toggle-degree"
                    class="peer sr-only"
                  />
                  <!-- Background slider -->
                  <span
                    class="absolute inset-0 bg-gray-300 rounded-full transition-colors"
                  ></span>
                  <!-- Dot container -->
                  <span
                    id="dot"
                    class="absolute left-1 top-1 w-6 h-6 bg-white rounded-full shadow-md flex items-center justify-between px-1 text-xs font-semibold text-gray-700 transition-transform peer-checked:text-white"
                    style="transform: translateX(0)"
                  >
                  </span>
                </label>
                <p>F</p>
              </div>

              <!-- image -->
              <div id="current-weather" class="flex justify-end">
                <!-- <img src="./assets/cloudy.png" alt="cloudy" class="h-52" /> -->
              </div>

              <!-- description -->
              <div class="self-end">
                <h1 id="current-weather-description" class="text-4xl">
                  <!-- Cloudy -->
                </h1>
                <!-- <h4 class="text-lg text-right">Feels like 27°C</h4> -->
              </div>
            </div>
          </div>
        </div>

        <!-- lower -->
        <div class="flex flex-col bg-gray-500 rounded-xl p-4 gap-2 mb-8">

          <div class="grid grid-cols-2 gap-6">
            <div class="w-auto h-auto p-4 text-white bg-slate-400 rounded-3xl">
              <p class="text-xl mb-4">Sunrise</p>

            </div>
            <div class="w-auto h-auto p-4 text-white bg-slate-400 rounded-3xl">

          </div>
        </div>

          <div class="flex justify-between items-center mb-4">

    <!-- modal Popup show all city -->
    <div
      id="modal-overlay"
      class="fixed hidden items-center justify-center bg-black bg-opacity-50 inset-0 z-10"
    >
      <div
        class="bg-white rounded-3xl p-6 w-2/3 max-h-[80vh] overflow-y-auto relative"

        <div class="flex justify-between items-center mb-6">
          <h1 class="text-2xl font-bold">Weather in other cities</h1>
