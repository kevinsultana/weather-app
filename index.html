<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Weather Web App</title>
  </head>
  <body>
    <!-- navbar -->
    <header class="p-4">
      <div
        class="bg-gray-400 rounded-xl p-4 w-full flex items-center justify-between gap-4 text-white"
      >
        <!-- logo -->
        <div class="w-1/3">
          <h1 class="text-left">Weather Web App Logo Icon</h1>
        </div>

        <!-- searchbar -->
        <div class="w-1/3 flex justify-center">
          <input
            type="text"
            placeholder="Search"
            class="px-4 py-1 border-2 rounded-xl w-full max-w-xs placeholder:text-gray-400"
          />
        </div>

        <!-- toggle dark mdoe -->
        <div class="w-1/3 flex justify-end">
          <label class="flex items-center gap-2">
            <span class="text-sm">Darkmode</span>
            <input type="checkbox" />
          </label>
        </div>
      </div>
    </header>

    <!-- main content -->
    <div class="flex justify-between mx-4">
      <!-- left content -->
      <div class="w-screen h-full bg-gray-500 rounded-xl p-4">
        <!-- location and toggle degree -->
        <div class="flex justify-between items-center mb-4">
          <div
            class="flex gap-2 items-center border-2 rounded-full py-2 px-4 w-fit"
          >
            <i class="fa-solid fa-location-dot"></i>
            <p>Jakarta</p>
          </div>

          <!-- toggle celcius fahrenheit -->
          <div>
            <label class="flex items-center gap-2">
              <span class="text-sm">Celcius</span>
              <input type="checkbox" />
            </label>
          </div>
        </div>

        <!-- details date time temp image -->
        <div>
          <h1>Monday</h1>
          <p>3 juni 2025</p>
        </div>
      </div>

      <!-- right content -->
      <div class="w-screen">
        <h1>tes</h1>
      </div>
    </div>
  </body>
</html>
